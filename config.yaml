# Configuración central del bot de pesca. Rutas relativas a la raíz del repo.

# Selección del modelo POR UBICACIÓN (ver locations/README.md). El modelo (.onnx) es gitignored.
detector_mode: specific    # general (models/general/detector.onnx) | specific (locations/<location>/detector.onnx)
location: stormwind        # carpeta dentro de locations/ (modelo + roi.yaml de esa zona)

detector:
  conf_threshold: 0.25     # el modelo nuevo (best_zona) no da FP a 0.25 (validado en 8B); reduce el flaqueo del relocate
  iou_threshold: 0.45
  imgsz: 640

bite:                      # trigger visual de la mordida por SPLASH (foam). Afinar EN VIVO.
  foam_threshold: 0.005    # fracción de píxeles casi-blancos en el parche (8B: flote~0, mordida 0.003-0.074)
  foam_min_frames: 2       # frames consecutivos sobre el umbral para disparar
  poll_fps: 30             # tasa de sondeo del foam (8B: separable hasta ~24 fps)
  relocate_seconds: 1.5    # cada cuánto re-localizar el corcho con YOLO (entre medias foam continuo)
  relocate_tolerance: 3    # fallos de relocate consecutivos antes de declarar "corcho perdido" y recastear
  max_wait_seconds: 25     # safety: sin mordida en este tiempo -> recast igual
  locate_timeout: 3.0      # segundos esperando a que aparezca el corcho tras castear antes de recastear

# NOTA: la ROI ya no está aquí. Vive en locations/<location>/roi.yaml (por ubicación).

input:
  cast_key: "2"            # tecla que lanza la caña (hechizo Pesca en la barra de acción)
  loot_button: right       # en WoW el corcho se recoge con CLIC DERECHO
  delay_after_click: 2.0   # segundos tras recoger antes de relanzar
  move_settle: 0.08        # s tras mover el cursor antes de pulsar (que el juego registre la posición)
  click_hold: 0.06         # s que se mantiene pulsado el botón (press->release no instantáneo)
  loot_settle: 0.2         # s tras el clic antes de parkear (que WoW registre el loot sobre el corcho)
  watchdog_interval: 3.0   # segundos entre sondeos del watchdog (alineado con los chunks de audio)
  watchdog_warn_after: 5   # avisar tras N recasts seguidos sin corcho (señal de deriva de cámara)
  mouse_park:              # punto FUERA de la ROI para parkear el cursor (no tapar el corcho)
    x: 300                 # ROI ocupa x 586..1334, y 126..513 -> (300,700) queda fuera. Ajusta a tu pantalla.
    y: 700

session:
  enabled: false           # true (o flag --record) para grabar frames/audio/eventos por ciclo
  dir: sessions
  frames:                  # secuencia de frames alrededor de la decisión (metraje para la Etapa 6)
    enabled: true
    fps: 10
    max_frames: 40         # cap de disco por ciclo (ring buffer)

logging:
  level: INFO              # DEBUG para ver los scores de audio por ciclo
  dir: logs
  file: pesca.log
  max_bytes: 1048576       # 1 MB por archivo
  backups: 5
