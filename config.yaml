# Configuración central del bot de pesca (Etapa 3). Rutas relativas a la raíz del repo.

model:
  onnx: models/corcho_detector/best.onnx   # runtime de inferencia ONNX

detector:
  conf_threshold: 0.5      # umbral alto por la tasa de falsos positivos medida en la Etapa 2
  iou_threshold: 0.45
  imgsz: 640

# Región de pantalla a capturar. Anclada a la sesión real 20260601_222727 (Etapa 6A):
# las dimensiones (748x387) = tamaño de los frames grabados; left/top derivados de los eventos
# (click - centro_bbox, unánime). Define la escala del corcho para captura/entrenamiento/inferencia.
roi:
  left: 586
  top: 126
  width: 748
  height: 387

input:
  cast_key: "2"            # tecla que lanza la caña (hechizo Pesca en la barra de acción)
  loot_button: right       # en WoW el corcho se recoge con CLIC DERECHO
  delay_after_click: 2.0   # segundos tras recoger antes de relanzar
  watchdog_interval: 3.0   # segundos entre sondeos del watchdog (alineado con los chunks de audio)
  watchdog_warn_after: 5   # avisar tras N recasts seguidos sin corcho (señal de deriva de cámara)
  mouse_park:              # punto FUERA de la ROI para parkear el cursor (no tapar el corcho)
    x: 300                 # ROI ocupa x 586..1334, y 126..513 -> (300,700) queda fuera. Ajusta a tu pantalla.
    y: 700

session:
  enabled: false           # true (o flag --record) para grabar frames/audio/eventos por ciclo
  dir: sessions
  frames:                  # secuencia de frames alrededor de la decisión (metraje para la Etapa 6)
    enabled: true
    fps: 10
    max_frames: 40         # cap de disco por ciclo (ring buffer)

logging:
  level: INFO              # DEBUG para ver los scores de audio por ciclo
  dir: logs
  file: pesca.log
  max_bytes: 1048576       # 1 MB por archivo
  backups: 5

audio:
  references: [Fishing_1.wav, Fishing_2.wav, Fishing_3.wav]
  fs: 44100
  duration: 3              # segundos de grabación por intento
  gain: 6.0                # no usado por el discriminador NCC-envolvente (invariante a escala)
  bandpass: [300.0, 3000.0]
  # Umbral del NCC de envolvente (audio_match). Calibrado con bench_audio.py:
  # negativos (ruido) <= ~0.07, positivos genuinos >= ~0.51 -> 0.30 deja margen a ambos lados.
  # OJO: provisional con negativos sintéticos; revisar con clips de gameplay reales.
  similarity_threshold: 0.30
  listen_window: 22        # segundos de escucha antes de relanzar la caña
